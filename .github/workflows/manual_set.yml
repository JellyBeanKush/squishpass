name: Manual SquishPass Sync
on:
  workflow_dispatch:
    inputs:
      new_total:
        description: 'Set total points to (e.g. 120.4)'
        required: true

jobs:
  sync-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force Update JSON
        run: |
          # Use jq to update the total_points field in your persistence file
          jq '.total_points = ${{ github.event.inputs.new_total }}' last_post_data.json > temp.json && mv temp.json last_post_data.json

      - name: Run Bot Logic
        run: |
          # This triggers your actual bot script to recalculate levels/milestones
          # Change "main.py" to whatever your logic script is named
          python main.py 

      - name: Commit and Push Results
        run: |
          git config --global user.name "SquishPass Sync"
          git config --global user.email "bot@github.com"
          git add last_post_data.json
          git commit -m "Manual sync to ${{ github.event.inputs.new_total }} - Logic Recalculated"
          git push
