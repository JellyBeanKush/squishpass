name: Manual SquishPass Sync
on:
  workflow_dispatch:
    inputs:
      new_total:
        description: 'Set total points to (e.g. 120.4)'
        required: true

jobs:
  sync-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force Update JSON Points
        run: |
          # This sets the total_points in your JSON to the new number
          jq '.total_points = ${{ github.event.inputs.new_total }}' last_post_data.json > temp.json && mv temp.json last_post_data.json

      - name: Run Bot Logic
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POINTS: 0 # We set this to 0 so it just recalculates the total from the JSON
        run: |
          node squishpass.mjs

      - name: Commit and Push
        run: |
          git config --global user.name "SquishPass Sync"
          git config --global user.email "bot@github.com"
          git add last_post_data.json
          git commit -m "Manual sync: ${{ github.event.inputs.new_total }} - Recalculated Logic"
          git push
