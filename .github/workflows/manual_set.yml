name: Manual SquishPass Sync

on:
  workflow_dispatch:
    inputs:
      new_total:
        description: 'Set total points (e.g. 120.4)'
        required: true

jobs:
  sync-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Force Update JSON Points
        run: |
          jq '.total_points = ${{ github.event.inputs.new_total }}' last_post_data.json > temp.json && mv temp.json last_post_data.json

      - name: Run Bot Logic
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POINTS: 0
        run: |
          node squishpass.mjs

      - name: Commit and Push
        run: |
          git config --global user.name "SquishPass Sync"
          git config --global user.email "bot@github.com"
          git add last_post_data.json images/final_discord_board.jpg
          git commit -m "Manual sync: ${{ github.event.inputs.new_total }} - Updated board image and JSON state"
          git push
