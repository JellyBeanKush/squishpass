name: Update SquishPass
on:
  repository_dispatch:
    types: [update_squishpass]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync and Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POINTS: ${{ github.event.client_payload.points }}
        run: |
          # 1. Setup Git Identity
          git config --global user.name 'SquishBot'
          git config --global user.email 'bot@github.com'
          
          # 2. Rebase to ensure we have the latest message_id from the JSON
          git pull --rebase origin main
          
          # 3. Run the script
          node squishpass.mjs

      - name: Push New ID
        run: |
          # Only commit if the ID actually changed
          git add last_post_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update persistence [skip ci]"
            # Use --rebase on push to handle rapid updates if points change quickly
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to save."
          fi
