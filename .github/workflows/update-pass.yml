name: Update SquishPass
on:
  repository_dispatch:
    types: [update_squishpass]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync and Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POINTS: ${{ github.event.client_payload.points }}
        run: |
          # 1. Setup Git Identity
          git config --global user.name 'SquishBot'
          git config --global user.email 'bot@github.com'
          
          # 2. Rebase to ensure we have the latest data before running logic
          git pull --rebase origin main
          
          # 3. Initialize persistence file if missing
          if [ ! -f last_post_data.json ]; then
            echo '{"message_id": null, "total_points": 0}' > last_post_data.json
          fi
          
          # 4. Run the script (this will now read old total and add incoming points)
          node squishpass.mjs

      - name: Push New ID and Points
        run: |
          # Commit because BOTH message_id OR total_points will have changed
          git add last_post_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update persistence score data [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to save."
          fi
