name: Update SquishPass
on:
  repository_dispatch:
    types: [update_squishpass]

permissions:
  contents: write # CRITICAL: Allows the bot to commit the updated JSON file back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures we get the full git history for pushing

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POINTS: ${{ github.event.client_payload.points }}
        run: node squishpass.mjs

      - name: Save Persistence
        run: |
          git config --global user.name 'SquishBot'
          git config --global user.email 'bot@github.com'
          git pull origin main --rebase # Get any updates that happened while the script ran
          git add last_post_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update persistence [skip ci]" && git push origin main)
